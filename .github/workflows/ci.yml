name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint · Typecheck · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma client 必须先生成。`build` 脚本自带 `prisma generate`，但这个 job 是**直接**跑
      # tsc/vitest 的 —— 缺了它 `@prisma/client` 没有生成类型，全仓 `db.*` 调用退化成 any，
      # tsc 会以 100+ 条 TS7006 失败（而 Production Build job 反而是绿的：
      # 它的脚本里已经 generate 过了 —— 这正是这个门一直红着却看不出原因的地方）。
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      # 单测**直接打本地 SQLite**：CI 是干净 checkout，既没有 dev.db 也没有 DATABASE_URL。
      # 空库会让用例红；只 migrate 不 seed 也会红（实测：service-catalogue 期望的
      # 6 条历史老服务为 0）。所以三者都要：generate → migrate deploy → seed。
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: "file:./dev.db"
      - run: pnpm db:seed
        env:
          DATABASE_URL: "file:./dev.db"
      - run: pnpm test
        env:
          DATABASE_URL: "file:./dev.db"

  e2e:
    name: Playwright (§74 mandatory journey + matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 必须 build：webServer 跑的是 `pnpm start`（next start），没有 .next 它会直接起不来。
      # 之前这个 job 一直失败在这里 —— 报的是 "Could not find a production build"，
      # 与测试本身无关，却让整条 CI 看起来像"测试挂了"。
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test
        env:
          CI: true
          # 这几条是 e2e 的**真实依赖**：登录走真实 Supabase（e2e/link-auth.ts 会把
          # User/Customer 的 authId 绑到真实 auth 用户）。缺了它们，登录类用例必然失败，
          # 而失败原因看起来会像"应用坏了"。
          # 需要在仓库 Settings → Secrets 里配置同名 secret；未配置时本 job 会红 ——
          # 这是有意的：宁可见红并知道缺什么，也不要 continue-on-error 把信号藏起来。
          DATABASE_URL: "file:./e2e.db"
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

# Release blocker (§97): the Ahmad E2E journey must pass before deploy.
